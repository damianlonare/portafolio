# Refreshes the featured video on /links. The site is a static export, so a
# change to content/music-video.json has to land on main for the host to rebuild.
# Runs every 6 hours. If YouTube does not answer, the script leaves the last
# good snapshot in place and this job does not push.

name: Refresh featured music video

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-music-video
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refresh-music-video.mjs
      - name: Commit the snapshot when the pick changes
        run: |
          if git diff --quiet -- content/music-video.json; then
            echo "Featured video unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/music-video.json
          git commit -m "Refresh featured music video from YouTube RSS"
          git push
